<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d35"><title>Мои рейсы · Driver 2.1 Demo</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#14233c;background:#eaf0f6;font-synthesis:none}*{box-sizing:border-box}html,body{min-height:100%;margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}input,select,textarea{width:100%;font-size:16px;border:1.3px solid #d6e1ed;border-radius:13px;background:#fff;color:#17283f;padding:13px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#3676e5;box-shadow:0 0 0 3px #3676e51b}input[type=checkbox],input[type=radio]{width:19px;height:19px;accent-color:#2465db;flex-shrink:0}textarea{resize:vertical;min-height:84px}label{display:block;font-size:13px;font-weight:700;color:#34465d;margin:0 0 7px}fieldset{border:0;padding:0;margin:0}h1,h2,h3,p{margin-top:0}h1{font-size:28px;letter-spacing:-.7px;margin-bottom:4px}h2{font-size:20px;letter-spacing:-.35px;margin-bottom:14px}h3{font-size:16px;margin-bottom:8px}.app{max-width:560px;min-height:100dvh;margin:0 auto;background:#f5f8fc;box-shadow:0 0 34px #0b1d3912;padding-bottom:95px}.head{background:linear-gradient(138deg,#101e36,#172f59);color:white;border-radius:0 0 25px 25px;padding:27px 22px 26px}.head .eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#a9c3ef}.head .sub{color:#b8c9e4;font-size:13px;line-height:1.5}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.headbadge{background:#ffffff18;border:1px solid #ffffff20;color:#edf4ff;padding:9px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}.notice{border:1px solid #dae5f4;background:#edf4ff;border-radius:14px;margin:14px 18px 0;padding:12px;color:#355274;font-size:12px;line-height:1.5}.main{padding:17px 18px}.card{background:#fff;border:1px solid #e7edf4;box-shadow:0 5px 22px #14264107;border-radius:20px;padding:18px;margin-bottom:14px}.card.soft{background:#edf4ff;border-color:#dce9fd}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.row{display:flex;align-items:center;gap:10px}.stack{display:grid;gap:12px}.gap8{display:grid;gap:8px}.mt{margin-top:14px}.mb{margin-bottom:14px}.small{font-size:12px;color:#71819a;line-height:1.5}.muted{color:#708097;font-size:13px;line-height:1.55}.strong{font-weight:800}.chip{font-weight:800;font-size:11px;border-radius:30px;padding:7px 10px;white-space:nowrap;background:#e8f0fc;color:#2059b7}.chip.green{background:#e2f6ea;color:#126a3a}.chip.amber{background:#fff2da;color:#925600}.chip.red{background:#fee8e8;color:#a52727}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{background:#f4f7fb;border:1px solid #eaf0f7;border-radius:13px;padding:11px}.stat b{display:block;color:#183456;margin-top:3px;font-size:15px;overflow-wrap:anywhere}.stat small{color:#78879b;font-size:11px}.btn{border:0;min-height:47px;background:#2066e6;color:#fff;font-weight:800;border-radius:13px;padding:12px 15px;font-size:14px;width:100%;transition:.12s}.btn:active{transform:scale(.99)}.btn.secondary{background:#e9f1fe;color:#1855ad}.btn.outline{background:#fff;border:1px solid #d3dfed;color:#2c4565}.btn.warning{background:#fff0de;color:#925100}.btn.danger{background:#fcebec;color:#a92037}.btn.dark{background:#172b4a}.btn.sm{font-size:12px;padding:9px 10px;min-height:35px;width:auto}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.buttons .full{grid-column:1/-1}.section-label{color:#7a8da9;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:1.25px;margin:2px 0 9px}.choice{display:flex;gap:11px;align-items:center;background:#f7f9fc;border:1px solid #e0e7f1;border-radius:13px;padding:11px 12px;margin-bottom:8px;cursor:pointer}.choice .desc{font-size:12px;color:#78899f;margin-top:2px}.checkline{display:flex;gap:11px;align-items:flex-start;padding:12px 5px;border-bottom:1px solid #f0f3f7;font-size:13px;color:#253853;line-height:1.45;cursor:pointer;font-weight:500}.checkline:last-child{border-bottom:0}.checkline input{margin:0 0 0 2px}.field{margin-bottom:13px}.hint{color:#75859b;font-size:11px;margin-top:6px;line-height:1.5}.divider{height:1px;background:#e9eef5;margin:15px 0}.timeline{border-left:2px solid #dce8fb;margin-left:7px;padding-left:15px}.logrow{position:relative;margin-bottom:14px;font-size:13px;line-height:1.45}.logrow:before{content:'';position:absolute;left:-21px;top:4px;border-radius:50%;height:10px;width:10px;background:#5692e8;border:2px solid #fff}.logrow b{display:block}.logrow small{display:block;color:#8a97aa;margin-top:3px}.empty{color:#8190a4;font-size:13px;line-height:1.5;padding:13px;border:1px dashed #dbe3ee;border-radius:13px;text-align:center}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border-top:1px solid #e1e9f1;padding:7px 6px max(8px,env(safe-area-inset-bottom));z-index:5;box-shadow:0 -5px 20px #15233f0a}.nav button{border:0;background:transparent;color:#8694a7;font-size:11px;font-weight:750;display:grid;gap:3px;justify-items:center;padding:5px 0}.nav button.active{color:#1e63d6}.nav button span{font-size:21px}.modalWrap{position:fixed;inset:0;z-index:30;background:#071327a8;display:flex;align-items:flex-end;justify-content:center;padding:0}.modal{width:min(560px,100%);max-height:94dvh;overflow-y:auto;background:#f8faff;border-radius:24px 24px 0 0;padding:22px 19px max(25px,env(safe-area-inset-bottom));box-shadow:0 -12px 40px #07162c33}.modal h2{padding-right:34px}.modalclose{border:0;background:#e8eff7;width:36px;height:36px;border-radius:50%;font-size:18px;color:#38506a;position:absolute;right:17px;top:17px}.modalTop{position:relative}.error{border-radius:10px;padding:10px;background:#ffeced;color:#9e2631;font-size:13px;margin:10px 0}.success{background:#e5f7ed;border:1px solid #c3e6d2;border-radius:12px;padding:13px;font-size:13px;color:#156d3c}.route{font-size:21px;letter-spacing:-.4px;font-weight:850;line-height:1.4}.filethumb{display:block;max-width:100%;max-height:170px;border-radius:11px;border:1px solid #dce7f3;margin-top:8px}.mono{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}.tripline{display:grid;grid-template-columns:85px 1fr;gap:8px 9px;font-size:13px}.tripline>span:nth-child(odd){color:#8591a1}.note{font-size:12px;padding:11px 12px;border-radius:12px;background:#f2f6fd;color:#465e80;line-height:1.55}.loginCover{padding:22px 18px 4px}.avatar{width:48px;height:48px;display:grid;place-items:center;background:#e7f0fe;color:#1d5bc4;border-radius:14px;font-weight:900;font-size:18px}.triptag{padding:5px 8px;border-radius:9px;background:#eff5fd;color:#52739e;font-weight:800;font-size:11px}.num{font-variant-numeric:tabular-nums}.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:13px}.kv:last-child{border:0}.kv span:first-child{color:#7c899b}.kv strong{text-align:right}.shortinfo{font-size:13px;line-height:1.5;color:#50657f}.close{border:0;cursor:pointer;background:transparent;color:inherit}a{color:#175cc5} @media(min-width:650px){.app{margin-top:22px;min-height:calc(100dvh - 22px);border-radius:22px 22px 0 0;overflow:hidden}.modalWrap{align-items:center;padding:20px}.modal{border-radius:23px;max-height:90dvh}.nav{bottom:0}}
</style></head><body><div class="app" id="app"></div><div id="overlay"></div>
<script>
'use strict';
// Standalone functional prototype. Never use these example PINs or client-side availability checks in production.
const KEY='driver-demo-v2-20261020';
const PRECHECK=[
 'Водительские документы, карта/чип тахографа и необходимые разрешения проверены',
 'Страховка, техосмотр и документы на тягач и прицеп проверены',
 'Шины, тормоза, свет и сцепное устройство осмотрены',
 'Замечаний к исправности тягача и прицепа нет',
 'Инструктаж прочитан, условия работы понятны'
];
const $=id=>document.getElementById(id);
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=iso=>iso?new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const num=v=>Number(v).toLocaleString('ru-RU',{maximumFractionDigits:2});
const when=()=>new Date().toISOString();
const makeDemo=()=>({version:2,userId:null,orderNumber:127,
 drivers:[{id:'d1',name:'Александр Иваненко',pin:'1111'},{id:'d2',name:'Павел Коваленко',pin:'2222'}],
 trucks:[{id:'t1',model:'DAF XF 480',plate:'ВН 1234 АА',status:'free',driverId:null,odo:185400},{id:'t2',model:'MAN TGX',plate:'ВН 5678 АА',status:'free',driverId:null,odo:90300},{id:'t3',model:'Volvo FH',plate:'ВН 7777 ВК',status:'busy',driverId:'outside',odo:120000},{id:'t4',model:'DAF XF 105',plate:'ВН 8888 ВК',status:'repair',driverId:null,odo:221800}],
 trailers:[{id:'p1',name:'Самосвальный',plate:'ВН 4343 ХТ',status:'free',driverId:null},{id:'p2',name:'Самосвальный',plate:'ВН 5656 ХТ',status:'free',driverId:null},{id:'p3',name:'Самосвальный',plate:'ВН 9999 ХТ',status:'busy',driverId:'outside'}],
 sessions:{},assignments:[],orders:[{id:'R-125',driverId:'d1',from:'Одесса',to:'Рени · порт',cargo:'Пшеница',customer:'Тест Агро',status:'assigned',createdAt:when(),ttn:'',loadKg:null,unloadKg:null,photo:null,segments:[],pauses:[]},{id:'R-126',driverId:'d2',from:'Маяки',to:'',cargo:'Соя',customer:'Тест Логистика',status:'assigned',createdAt:when(),ttn:'',loadKg:null,unloadKg:null,photo:null,segments:[],pauses:[]}],fuelPeriods:{},fuelings:[],expenses:[],events:[],messages:[{driverId:'d1',kind:'in',message:'Образец заполнения ТТН: проверьте номер документа, погрузочный вес. После выгрузки пришлите фото весовой.',at:when()},{driverId:'d2',kind:'in',message:'После загрузки пришлите номер ТТН и фото документа.',at:when()}]});
let db;try{db=JSON.parse(localStorage.getItem(KEY));if(!db||db.version!==2)db=makeDemo()}catch{db=makeDemo()}
for(const order of db.orders||[])delete order.seal;
for(const msg of db.messages||[])if(typeof msg.message==='string')msg.message=msg.message.replace(' и пломбу','');
let page='trip',modal='',toast='';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(err){alert('Недостаточно места в памяти браузера. Попробуйте удалить крупные фото или экспортировать журнал.');return false}}
function record(type,details,extra={}){db.events.unshift({id:'E'+(Date.now())+Math.random().toString(36).slice(2,5),type,details,driverId:db.userId,at:when(),...extra});}
function currentUser(){return db.drivers.find(d=>d.id===db.userId)}
function session(){return db.sessions[db.userId]||null}
function truck(id){return db.trucks.find(x=>x.id===id)}
function trailer(id){return db.trailers.find(x=>x.id===id)}
function startAssignment(s,reason,startOdo){
 const a={id:'A'+Date.now()+Math.random().toString(36).slice(2,7),driverId:db.userId,truckId:s.truckId,trailerId:s.trailerId,startAt:when(),startOdo,reason,endAt:null,endOdo:null};
 db.assignments.push(a);s.assignmentId=a.id;
}
function endAssignment(s,endOdo){const a=db.assignments.find(a=>a.id===s.assignmentId&&!a.endAt);if(a){if(!Number.isFinite(endOdo)||endOdo<a.startOdo)throw Error('Одометр передачи меньше начального: '+num(a.startOdo));a.endAt=when();a.endOdo=endOdo}}
function trip(){return db.orders.find(t=>t.driverId===db.userId&&['active','paused'].includes(t.status))||db.orders.filter(t=>t.driverId===db.userId&&t.status==='assigned').at(-1)||null}
function fmtStatus(s){return({assigned:'Получен',active:'В пути',paused:'Пауза',review:'На проверке',done:'Утверждён',interrupted:'Прерван'})[s]||s}
function badge(s){let c=({assigned:'amber',active:'green',paused:'amber',review:'amber',done:'green',interrupted:'red'})[s]||'';return `<span class="chip ${c}">${h(fmtStatus(s))}</span>`}
function render(){const u=currentUser(),s=session(),t=trip();const sub=!u?'Выберите тестового водителя':u.name;const title=!u?'Вход водителя':!s?'Начало работы':({trip:'Мои рейсы',docs:'Документы',fuel:'Топливо',history:'История',profile:'Профиль',dispatch:'Логист · демо'})[page];
$('app').innerHTML=`<header class="head"><div class="headrow"><div><div class="eyebrow">TRANSPORT ERP · DRIVER</div><h1 style="margin-top:8px">${title}</h1><div class="sub">${h(sub)}</div></div><span class="headbadge">DEMO 4.3</span></div></header><div class="notice">⚠️ Тестовый прототип. Всё хранится в браузере. Раздел логиста имитирует сообщения, не отправляя их другому человеку.</div>${!u?renderLogin():!s?renderSetup(u):`<main class="main">${page==='trip'?renderTrip(s,t):page==='docs'?renderDocs(s,t):page==='fuel'?renderFuel(s):page==='history'?renderHistory():page==='dispatch'?renderDispatch():renderProfile(s)}</main>${renderNav()}`}`;
 $('overlay').innerHTML=modal?modal:'';}
function renderLogin(){return `<main class="main"><div class="card"><h2>Войти в приложение</h2><div class="muted mb">Выберите тестового водителя. PIN-коды ниже предназначены только для проверки интерфейса.</div><form id="loginForm"><div class="field"><label for="loginDriver">Водитель</label><select id="loginDriver" required>${db.drivers.map(d=>`<option value="${d.id}">${h(d.name)}</option>`).join('')}</select></div><div class="field"><label for="loginPin">PIN-код</label><input id="loginPin" required inputmode="numeric" type="password" maxlength="4" placeholder="Например, 1111" autocomplete="off"></div><button class="btn" type="submit">Войти</button></form><div class="note mt">Для проверки: Александр — <b>1111</b>, Павел — <b>2222</b>, Сергей — <b>3333</b>, Андрей — <b>4444</b>. Это имитация входа, а не безопасная проверка личности.</div></div><button class="btn outline" data-action="reset">↻ Сбросить демонстрацию</button></main>`}
function renderSetup(u){let freeT=db.trucks.filter(t=>t.status==='free'),freeP=db.trailers.filter(t=>t.status==='free');return `<main class="main"><div class="card"><div class="between"><h2 style="margin:0">Начало смены</h2><span class="chip">${h(u.name.split(' ')[0])}</span></div><p class="muted mt">Выбирайте только свободные тягач и прицеп. Занятые и находящиеся в ремонте не отображаются.</p><form id="setupForm"><div class="field"><label for="setupTruck">Свободный тягач</label><select id="setupTruck" required>${freeT.length?freeT.map(x=>`<option value="${x.id}">${h(x.model)} · ${h(x.plate)} · ${num(x.odo)} км</option>`).join(''):'<option value="">Нет свободных тягачей</option>'}</select></div><div class="field"><label for="setupTrailer">Свободный прицеп</label><select id="setupTrailer" required>${freeP.length?freeP.map(x=>`<option value="${x.id}">${h(x.name)} · ${h(x.plate)}</option>`).join(''):'<option value="">Нет свободных прицепов</option>'}</select></div><div class="field"><label for="setupOdo">Показание одометра, км</label><input id="setupOdo" type="number" min="0" step="1" required value="${freeT[0]?.odo??''}"></div><label class="checkline" style="background:#f0f6ff;border-radius:12px;padding:11px"><input id="setupFull" type="checkbox"> На старте бак полный (подтверждено)</label><div class="divider"></div><div class="section-label">Предрейсовая проверка</div>${PRECHECK.map((c,i)=>`<label class="checkline"><input type="checkbox" name="precheck" value="${i}" required><span>${h(c)}</span></label>`).join('')}<p class="hint">Подтверждения сохраняются в журнале. Они не являются доказательством вины при поломке.</p><button ${!freeT.length||!freeP.length?'disabled':''} type="submit" class="btn mt">✓ Автомобиль исправен · Готов к работе</button></form></div><button class="btn outline" data-action="logout">← Сменить водителя</button></main>`}
function renderNav(){return `<nav class="nav">${[['trip','🚛','Рейсы'],['docs','📄','ТТН'],['fuel','⛽','Топливо'],['history','🕒','История'],['profile','👤','Профиль']].map(([p,e,t])=>`<button data-tab="${p}" class="${p===page?'active':''}"><span>${e}</span>${t}</button>`).join('')}</nav>`}
function renderTrip(s,t){let T=truck(s.truckId),P=trailer(s.trailerId);let current=t?`<div class="card"><div class="between mb"><span class="triptag">НАРЯД ${h(t.id)}</span>${badge(t.status)}</div><div class="route">${h(t.from)} <span style="color:#a3b1c4">→</span> ${h(t.to||"Назначение уточняется")}</div><div class="statgrid mt"><div class="stat"><small>Культура</small><b>${h(t.cargo)}</b></div><div class="stat"><small>Заказчик</small><b>${h(t.customer)}</b></div><div class="stat"><small>Тягач</small><b>${h(T.plate)}</b></div><div class="stat"><small>Прицеп</small><b>${h(P.plate)}</b></div></div><div class="divider"></div>${renderTripButtons(t)}</div>`:`<div class="card"><h2>Текущий рейс</h2><div class="empty">Активного наряда нет. Для тестирования можно создать новый.</div><a href="./logist.html?v=4.2" class="btn mt" style="display:block;text-align:center">Попросить логиста выдать наряд ↗</a></div>`;
let activePause=t?.pauses.find(x=>!x.endedAt);return `<div class="section-label">Рабочее место</div><div class="card soft"><div class="between"><div><div style="font-weight:850">${h(T.model)} · ${h(T.plate)}</div><div class="muted">Прицеп ${h(P.plate)}</div></div><span class="chip green">Закреплено за вами</span></div><div class="between mt"><span class="small">Машина остаётся за вами после закрытия рейса</span><button class="btn sm outline" data-tab="profile">Детали</button></div></div>${current}${activePause?`<div class="card"><span class="chip amber">Остановка</span><h3 class="mt">${h(activePause.reasonLabel)}</h3><div class="muted">Начало: ${date(activePause.startedAt)}</div><p class="shortinfo mt">${h(activePause.note||'Без дополнительного описания')}</p>${activePause.photo?`<img class="filethumb" alt="Фото поломки" src="${activePause.photo}">`:''}</div>`:''}<div class="card"><h2>Быстрые действия</h2><div class="buttons"><button class="btn secondary" data-action="fuel">⛽ Заправка</button><button class="btn secondary" data-action="expense">💳 Расход</button><button class="btn secondary" data-action="${t?.loadedAt?'moreDocs':'load'}" ${!t?'disabled':''}>📄 Загрузка / документы</button><button class="btn secondary" data-tab="docs">💬 Сообщения</button></div></div><div class="card"><h2>Последние события</h2>${renderEvents(4)}</div>`}
function renderTripButtons(t){if(t.status==='assigned')return '<button class="btn" data-action="start">▶ Начать рейс</button>';if(t.status==='active')return '<div class="stack">'+(t.loadedAt?'<div class="note">✓ Загрузка подтверждена. Нетто '+num(t.loadKg)+' кг</div>':'<button class="btn" data-action="load">📷 Загрузился · веса и талон</button>')+'<div class="buttons"><button class="btn warning" data-action="pause">⏸ Пауза / проблема</button><button class="btn" data-action="finish" '+(!t.loadedAt?'disabled':'')+'>✓ Выгрузился · отчёт</button></div></div>';if(t.status==='paused')return '<div class="stack"><button class="btn" data-action="resume">▶ Продолжить рейс</button><div class="buttons"><button class="btn secondary" data-action="changeTruck">🚛 Сменить тягач</button><button class="btn secondary" data-action="changeTrailer">🔁 Перецепить</button></div><button class="btn danger" data-action="interrupt">Прервать ходку</button></div>';return ''}
function renderDocs(s,t){const list=db.messages.filter(m=>m.driverId===db.userId&&(!m.tripId||db.orders.some(o=>o.id===m.tripId&&!o.cancelledAt&&!o.archivedAt))&&(!m.tripId||!t||m.tripId===t.id)).slice(-12);const past=[...db.orders].reverse().find(r=>r.driverId===db.userId&&!r.cancelledAt&&!r.archivedAt&&(r.ttn||r.loadedAt));const current=t||past;return `<div class="card"><h2>Загрузка, ТТН и весовые</h2><p class="muted">После загрузки внесите тару и брутто, проверьте нетто и приложите талон. OCR пока не подключён.</p>${t?`<div class="note mb">Наряд <b>${h(t.id)}</b> · ${h(t.from)} → ${h(t.to||'Назначение уточняется логистом')}</div>`:''}<div class="buttons"><button class="btn secondary" data-action="load" ${!t||t.status!=='active'||!!t.loadedAt?'disabled':''}>📷 Подтвердить загрузку</button><button class="btn secondary" data-action="moreDocs" ${!t||!t.loadedAt?'disabled':''}>+ Фото документов</button></div>${current?.loadedAt?`<div class="divider"></div><div class="kv"><span>Тара</span><strong>${num(current.tareKg)} кг</strong></div><div class="kv"><span>Брутто</span><strong>${num(current.grossKg)} кг</strong></div><div class="kv"><span>Нетто</span><strong>${num(current.loadKg)} кг</strong></div><div class="kv"><span>Фото</span><strong>${storedPhotos(current).length} из 50</strong></div><div class="note">✓ Веса подтверждены водителем · ${date(current.loadedAt)}</div>`:''}${current?.attachments?.slice(-6).map(a=>`<img class="filethumb" alt="Фото документа" src="${a.photo}">`).join('')||''}</div><div class="card"><div class="between"><h2>Указания логиста</h2><a class="btn sm outline" href="./logist.html?v=4.2">Панель логиста ↗</a></div><p class="muted">Временное направление и окончательное назначение отличаются. Изменения задания подтверждаются отдельно.</p>${pendingInstructions(t)}${list.filter(m=>m.kind==='out').map(m=>`<div class="note mt"><div class="small">Ваше сообщение · ${date(m.at)}</div>${h(m.message)}</div>`).join('')}<form id="messageForm" class="mt"><div class="field"><label for="message">Ответить логисту (локальный тест)</label><textarea id="message" required maxlength="700" placeholder="Например: загрузился, талон отправил"></textarea></div><button class="btn secondary" type="submit">Сохранить сообщение</button></form></div>`}

function storedPhotos(t){return t.attachments||[]}
const attachmentField=()=>'<div class="field"><label for="photos">Фото документов / талонов (можно несколько, всего до 50 на ходку)</label><input id="photos" type="file" accept="image/*" multiple><div class="hint">Демо: фотографии сжимаются и сохраняются только в этом браузере. Для реальной работы нужен защищённый сервер и устойчивое хранение.</div></div>';
async function stagePhotos(t,stage,required){
 const files=Array.from($('photos')?.files||[]);
 if(required&&!files.length)throw Error('Прикрепите фотографию талона или документа');
 if(storedPhotos(t).length+files.length>50)throw Error('К одной ходке можно приложить максимум 50 фотографий');
 const out=[];
 for(const file of files){
  if(!file.type.startsWith('image/'))throw Error('Допускаются только изображения');
  if(file.size>16*1024*1024)throw Error('Одно исходное фото не должно превышать 16 МБ');
  const photo=await new Promise((resolve,reject)=>{
   const img=new Image(),url=URL.createObjectURL(file);
   img.onload=()=>{try{const k=Math.min(1,640/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',0.43))}catch(err){reject(err)}finally{URL.revokeObjectURL(url)}};
   img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Фотографию не удалось прочитать'))};img.src=url;
  });
  out.push({id:'IMG'+Date.now()+Math.random().toString(36).slice(2,6),stage,name:file.name,at:when(),photo});
 }
 return out;
}

function pendingInstructions(t){
 if(!t)return '';
 return db.messages.filter(m=>m.driverId===db.userId&&m.tripId===t.id&&m.kind==='in').slice(-4).reverse().map(m=>
 '<div class="note mt" style="border-left:3px solid #4b75ce"><b>'+(m.directiveType==='intermediate'?'Промежуточное указание':'Инструкция логиста')+'</b><div class="shortinfo">'+h(m.message)+'</div><div class="small">'+date(m.at)+'</div>'+
 (!m.acknowledgedAt?'<button class="btn sm secondary mt" data-action="ack:'+h(m.id)+'">✓ Прочитал и понял</button>':'<div class="small" style="color:#13714d">✓ Подтверждено '+date(m.acknowledgedAt)+'</div>')+'</div>').join('');
}

function renderFuel(s){const T=truck(s.truckId);const periods=db.fuelPeriods[s.truckId]||[];const current=periods.find(p=>p.status==='open');const done=periods.filter(p=>p.status==='closed');const myFuel=db.fuelings.filter(f=>f.truckId===s.truckId).slice(-7).reverse();return `<div class="card"><div class="between"><h2>Топливо тягача</h2><span class="chip">${h(T.plate)}</span></div><p class="muted">Топливный период может включать несколько завершённых ходок. Привязан к машине, с историей фактических водителей.</p><div class="buttons"><button class="btn" data-action="fuel">+ Заправка</button><button class="btn secondary" data-tab="history">История рейсов</button></div></div><div class="card"><h2>Текущий период</h2>${current?`<div class="kv"><span>Начальный одометр</span><strong>${num(current.startOdo)} км</strong></div><div class="kv"><span>Контроль полного бака</span><strong>${current.anchored?'Есть':'Нет'}</strong></div><div class="kv"><span>Заправлено в периоде</span><strong>${num(current.fuelings.reduce((a,f)=>a+f.liters,0))} л</strong></div><div class="kv"><span>Заправок</span><strong>${current.fuelings.length}</strong></div><div class="note mt">${current.anchored?'Средний расход пока не рассчитан: нужен следующий подтверждённый полный бак.':'Начальный полный бак не подтверждён. Точный средний расход пока неизвестен.'}</div>`:'<div class="empty">Нет открытого топливного периода.</div>'}</div><div class="card"><h2>Закрытые периоды</h2>${done.length?done.slice(-5).reverse().map(p=>`<div class="stat mb"><div class="between"><strong>${num(p.startOdo)} → ${num(p.endOdo)} км</strong><span class="chip ${p.average==null?'amber':p.average>36?'red':'green'}">${p.average==null?'Не рассчитан':num(p.average)+' л/100 км'}</span></div><div class="small">${num(p.litersTotal)} л · ${num(p.distance)} км · ${date(p.endedAt)} · ${countTripsForPeriod(T.id,p)} ходок</div><div class="small">${h(driverNamesForPeriod(T.id,p))}</div></div>`).join(''):'<div class="empty">После подтверждения следующей заправки до полного появится расчёт.</div>'}</div><div class="card"><h2>Заправки</h2>${myFuel.length?myFuel.map(f=>`<div class="kv"><span>${date(f.at)} · ${h(f.station)}${f.full?' · полный':''}</span><strong>${num(f.liters)} л</strong></div>`).join(''):'<div class="empty">Заправок пока нет</div>'}</div>`}
function relevantTrips(truckId,p){return db.orders.filter(t=>t.segments.some(s=>s.truckId===truckId && (s.endOdo??Infinity)>p.startOdo && s.startOdo<(p.endOdo??Infinity)))}
function countTripsForPeriod(t,p){return relevantTrips(t,p).length}
function driverNamesForPeriod(t,p){let ids=[...new Set(relevantTrips(t,p).flatMap(o=>o.segments.filter(s=>s.truckId===t&&(s.endOdo??Infinity)>p.startOdo&&s.startOdo<(p.endOdo??Infinity)).map(s=>s.driverId)))];return ids.length?'Водители: '+ids.map(id=>db.drivers.find(d=>d.id===id)?.name||'Неизвестен').join(', '):'Нет подтверждённых участков поездок'}
function renderHistory(){let orders=db.orders.filter(o=>o.driverId===db.userId&&!o.cancelledAt&&!o.archivedAt).slice().reverse();return `<div class="card"><h2>Мои ходки</h2>${orders.length?orders.map(t=>`<div style="border-bottom:1px solid #edf1f7;padding:12px 0"><div class="between"><b>${h(t.id)} · ${h(t.cargo)}</b>${badge(t.status)}</div><div class="shortinfo">${h(t.from)} → ${h(t.to)}</div><div class="small">${t.segments.length} участков · ${t.finishedAt?date(t.finishedAt):'В работе'}</div>${t.ttn?`<div class="small">ТТН: ${h(t.ttn)}${t.loadKg!=null&&t.unloadKg!=null?' · разница '+num(t.loadKg-t.unloadKg)+' кг':''}</div>`:''}</div>`).join(''):'<div class="empty">Рейсов нет</div>'}</div><div class="card"><h2>Журнал действий</h2>${renderEvents(35)}</div>`}
function renderEvents(limit){let ev=db.events.filter(e=>e.driverId===db.userId).slice(0,limit);return ev.length?`<div class="timeline">${ev.map(e=>`<div class="logrow"><b>${h(e.type)}</b><div class="shortinfo">${h(e.details)}</div><small>${date(e.at)}</small>${e.photo?`<img class="filethumb" alt="Фото события" src="${e.photo}">`:''}</div>`).join('')}</div>`:'<div class="empty">Действий пока нет</div>'}
function renderProfile(s){let T=truck(s.truckId),P=trailer(s.trailerId);return `<div class="card"><h2>Моя смена</h2><div class="kv"><span>Водитель</span><strong>${h(currentUser().name)}</strong></div><div class="kv"><span>Тягач</span><strong>${h(T.model)} · ${h(T.plate)}</strong></div><div class="kv"><span>Прицеп</span><strong>${h(P.plate)}</strong></div><div class="kv"><span>Начало смены</span><strong>${date(s.startedAt)}</strong></div><div class="kv"><span>Начальный одометр</span><strong>${num(s.odoStart)} км</strong></div><div class="note mt">Выбор сделан из списка свободной техники. Смена тягача или прицепа во время рейса — через остановку и отдельное подтверждение.</div></div><div class="card"><h2>История использования техники</h2>${db.assignments.filter(a=>a.driverId===db.userId).slice().reverse().map(a=>`<div class="kv"><span>${h(truck(a.truckId)?.plate||'—')} · ${date(a.startAt)}<div class="small">${h(a.reason)}</div></span><strong>${num(a.startOdo)} → ${a.endOdo==null?'в работе':num(a.endOdo)} км</strong></div>`).join('')||'<div class="empty">История пока пустая</div>'}</div><div class="card"><h2>Завершение работы</h2><p class="muted">Завершение ходки не освобождает машину. Здесь вы сможете освободить её, когда работа окончена.</p><button class="btn danger" data-action="release" ${db.orders.some(x=>x.driverId===db.userId&&['active','paused'].includes(x.status))?'disabled':''}>Освободить тягач и прицеп</button><div class="hint">Во время движения или паузы машина не может быть освобождена.</div></div><div class="card"><h2>Тестирование</h2><div class="stack"><button class="btn outline" data-action="export">⬇ Скачать журнал JSON</button><button class="btn outline" data-action="logout">⇄ Сменить водителя (без освобождения авто)</button><button class="btn danger" data-action="reset">↻ Сбросить все демоданные</button></div><p class="hint mt">Статусы техники синхронизируются только между вкладками одного браузера через локальное хранилище. Между разными телефонами синхронизации нет.</p></div>`}

function openAction(action){const s=session(),t=trip();if(!s)return;

 if(action==='load'){if(!t||t.status!=='active'||t.loadedAt)return;showModal('Машина загружена', '<div class="note mb">Введите данные талона. Нетто рассчитывается автоматически: брутто − тара. Отчёт будет виден в симуляторе логиста сразу после подтверждения.</div>'+formField('tareKg','Тара, кг','number',t.tareKg??'','required min="1" step="1"')+formField('grossKg','Брутто, кг','number',t.grossKg??'','required min="1" step="1"')+'<div class="note mb" id="netPreview">Нетто: заполните оба веса</div>'+formField('ttn','№ ТТН (если уже выдали)','text',t.ttn||'','maxlength="100"')+attachmentField()+'<label class="checkline"><input id="checkedLoad" type="checkbox" required> Я проверил тару, брутто, нетто и фото по реальному талону</label>','Отправить загрузку логисту','load');return}
 if(action==='moreDocs'){if(!t||!t.loadedAt)return;showModal('Добавить документы',attachmentField()+'<label class="checkline"><input id="checkedPhotos" type="checkbox" required> Я проверил правильность прикреплённых документов</label>','Прикрепить фото','moreDocs');return}
 if(action==='finish'){if(!t||t.status!=='active'||!t.loadedAt)return;showModal('Выгрузился · Отчёт', '<div class="note mb">Нетто погрузки: '+num(t.loadKg)+' кг · '+h(t.to||'назначение ещё уточняется')+'</div>'+formField('ttn','Номер ТТН (если выдана)','text',t.ttn||'','maxlength="100"')+formField('unloadKg','Нетто выгрузки, кг','number',t.unloadKg??'','required min="1" step="1"')+formField('endOdo','Одометр по завершении, км','number',truck(s.truckId).odo,'required min="0" step="1"')+attachmentField()+'<label class="checkline"><input id="checkedUnload" type="checkbox" required> Проверил вес выгрузки, ТТН и приложенные талоны. Подтверждаю точность данных</label>','Отправить на проверку логисту','finish');return}

 if(action==='pause'){showModal('Причина остановки',`${selectField('pauseReason','Выберите причину',[['rest','Отдых'],['loading','Ожидание погрузки'],['unloading','Ожидание выгрузки'],['truck_fault','Поломка тягача'],['trailer_fault','Поломка прицепа'],['other','Другая причина']].map(([v,l])=>`<option value="${v}">${l}</option>`).join(''))}${textareaField('note','Описание (обязательно при поломке)')}${photoField()}`,'Зафиксировать остановку','pause');return}
 if(action==='resume'){let p=t?.pauses.find(x=>!x.endedAt);if(!p)return;if(['truck_fault','trailer_fault'].includes(p.reason)){showModal('Возобновить после поломки',`${textareaField('note','Что исправлено / почему можно ехать',true)}<label class="checkline"><input type="checkbox" id="fixed" required> Неисправность устранена, техника проверена</label>`,'Продолжить рейс','resume');return}finishPause(t,'Продолжение движения');t.status='active';record('Рейс продолжен',t.id);persist();render();return}
 if(action==='start'){showModal('Начать рейс',`<div class="note mb">${h(t.id)} · ${h(t.from)} → ${h(t.to)}</div>${formField('startOdo','Показание одометра, км','number',truck(s.truckId).odo,'required min="0" step="1"')}`,'Начать движение','start');return}

if(action==='closeModal'){modal='';render();return}if(action==='logout'){db.userId=null;page='trip';persist();render();return}if(action==='reset'){if(confirm('Удалить все демоданные и начать сначала?')){db=makeDemo();page='trip';modal='';persist();render()}return}if(action==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='transport-driver-demo-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);return}if(action==='newOrder'){if(!session())return;if(trip()){alert('Сначала завершите текущий наряд');return}const patterns=[['Рени','Одесса','Соя'],['Измаил','Рени · порт','Кукуруза'],['Маяки','Черноморск','Пшеница'],['Одесса','Рени','Ячмень']];let pattern=patterns[db.orderNumber%patterns.length],t={id:'R-'+db.orderNumber++,driverId:db.userId,from:pattern[0],to:db.orderNumber%2===0?'':pattern[1],cargo:pattern[2],customer:'Тест Агро',status:'assigned',createdAt:when(),ttn:'',loadKg:null,unloadKg:null,photo:null,segments:[],pauses:[]};db.orders.push(t);record('Новый тестовый наряд',t.id+' · '+t.from+' → '+t.to);persist();page='trip';render();return}if(['load','moreDocs','pause','resume','fuel','expense','ttn','finish','start','changeTruck','changeTrailer','interrupt','release'].includes(action))openAction(action)}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action], [data-tab]');if(!el)return;if(el.dataset.tab){page=el.dataset.tab;modal='';render()}else if(el.dataset.action)handleAction(el.dataset.action)});
document.addEventListener('input',ev=>{if(ev.target.id==='tareKg'||ev.target.id==='grossKg'){const a=valueNum('tareKg'),b=valueNum('grossKg'),el=$('netPreview');if(el)el.textContent=Number.isFinite(a)&&Number.isFinite(b)&&b>a?'Нетто: '+num(b-a)+' кг':'Нетто: проверьте тару и брутто'}});
document.addEventListener('change',ev=>{if(ev.target.id==='setupTruck'){const T=truck(val('setupTruck'));if(T)$('setupOdo').value=T.odo}if(ev.target.id==='nextTruck'){const T=truck(val('nextTruck'));if(T)$('newStartOdo').value=T.odo}});
document.addEventListener('submit',async ev=>{const form=ev.target;if(!['loginForm','setupForm','messageForm','actionForm'].includes(form.id))return;ev.preventDefault();const btn=form.querySelector('[type="submit"]');if(btn)btn.disabled=true;try{
 if(form.id==='loginForm'){const d=db.drivers.find(x=>x.id===val('loginDriver'));if(!d||d.pin!==val('loginPin'))throw Error('Неверный тестовый PIN');db.userId=d.id;page='trip';persist();render();return}
 if(form.id==='setupForm'){const T=truck(val('setupTruck')),P=trailer(val('setupTrailer'));if(!T||T.status!=='free'||!P||P.status!=='free')throw Error('Выбранная техника уже недоступна');if(db.sessions[db.userId])throw Error('Смена уже открыта');const odo=valueNum('setupOdo');if(!Number.isFinite(odo)||odo<T.odo)throw Error('Показание не может быть меньше '+num(T.odo)+' км');if([...form.querySelectorAll('[name=precheck]')].some(x=>!x.checked))throw Error('Проверьте все пункты инструктажа');T.status='busy';T.driverId=db.userId;T.odo=odo;P.status='busy';P.driverId=db.userId;db.sessions[db.userId]={driverId:db.userId,truckId:T.id,trailerId:P.id,odoStart:odo,startedAt:when(),precheck:PRECHECK.map((text)=>({text,at:when()}))};startAssignment(db.sessions[db.userId],'Начало смены',odo);openPeriod(T.id,odo,$('setupFull').checked);record('Начало смены',`${T.plate} · прицеп ${P.plate} · ${num(odo)} км`);persist();render();return}
 if(form.id==='messageForm'){const text=val('message');if(!text)throw Error('Введите сообщение');db.messages.push({driverId:db.userId,kind:'out',message:text,at:when()});record('Сообщение',text);persist();render();page='docs';return}
 if(form.id==='actionForm'){await submitKind(form.dataset.kind);return}
 }catch(e){if(form.id==='actionForm')alertForm(e.message);else alert(e.message);if(btn)btn.disabled=false}});
window.addEventListener('storage',ev=>{if(ev.key===KEY){try{db=JSON.parse(ev.newValue)||makeDemo()}catch{db=makeDemo()}modal='';render()}});
window.demoDebug=()=>db; // local test diagnostics only
render();
</script><script src="./driver-wallet.js?v=4.2"></script></body></html>
